name: localbrain-web-search
services:
  searxng:
    image: ghcr.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: localbrain-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:?prepare local config first}:8080"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?prepare local config first}
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      GRANIAN_WORKERS: "1"
      FORCE_OWNERSHIP: "false"
    volumes:
      - "./settings.yml:/etc/searxng/settings.yml:ro"
